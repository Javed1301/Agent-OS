services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKSPACE_ROOT: /app
      DOCKER_ENV: "true"
      UV_CACHE_DIR: /root/.cache/uv
      DATABASE_URL: "file:/app/data/agent-os.db"
    volumes:
      - ./data:/app/data
      - ./workflows:/app/workflows
      - ./agents:/app/agents
      - ./external-agents:/app/external-agents
      - ./scripts:/app/scripts
      - ./runtimes:/app/runtimes
      - ./uv-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    driver: bridge
