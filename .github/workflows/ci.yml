name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for pull requests when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/gateway/prisma/schema.prisma

      - name: Lint Dashboard
        run: npm run lint --workspace=apps/dashboard

      - name: Typecheck Gateway
        run: npm run build --workspace=apps/gateway

  test:
    name: Test Suite (Unit, Lifecycle & Integration)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # The environment-resolution unit tests (environment-resolution.test.ts) discover
      # the system Python interpreter path and version, requiring a Python runtime.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      # Prisma client generation must be executed prior to running tests
      # because gateway components compile against and import types from '@prisma/client'.
      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/gateway/prisma/schema.prisma

      # Runs unit, repository, provider, lifecycle, and integration test suites
      - name: Run Deterministic Tests
        run: npm test

      # Upload diagnostic artifacts on test failure for faster debugging
      - name: Upload Test Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs
          path: |
            apps/gateway/data/test/
            apps/gateway/test-output-json.txt

  build:
    name: Production Build & Container Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/gateway/prisma/schema.prisma

      - name: Build All Applications
        run: npm run build

      - name: Validate Gateway Dockerfile Build
        run: docker build -f apps/gateway/Dockerfile -t agent-gateway:ci-test .

  security:
    name: Security & Audit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high --workspace=apps/gateway --workspace=apps/dashboard
        continue-on-error: true
